[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurallm"
version = "2.0.0a2"
description = "Deterministic research software for evaluating neural control of LLM decoding"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "jaghachi" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
]
dev = [
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
neurallm = "neurallm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
show_error_codes = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-m 'not live' --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "live: requires an explicitly configured live provider and is excluded by default",
]

[tool.coverage.run]
branch = true
source = ["neurallm"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
