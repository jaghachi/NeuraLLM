# synthetic_effect_code is inert experiment metadata. A provider-free integration
# harness converts each code into independent evaluator records; FakeProvider and
# production runtime do not read the code or manufacture these known outcomes.
schema_version: 1
dataset_id: phase3-evaluator-validation
version: phase3-evaluator-validation-v1
purpose: synthetic
sequences:
  - sequence_id: synthetic-known-superior
    cases:
      - case_id: synthetic-known-superior-0
        prompt_family: synthetic_known_superior
        prompt: Synthetic superior condition, turn zero. Return a non-empty response.
        prompt_features:
          synthetic_effect_code: 1.0
          target_length: 64.0
        validator:
          kind: non_empty
      - case_id: synthetic-known-superior-1
        prompt_family: synthetic_known_superior
        prompt: Synthetic superior condition, first adaptive turn. Include superior and recovery.
        prompt_features:
          synthetic_effect_code: 1.0
          target_length: 64.0
        validator:
          kind: contains_all
          required_terms:
            - superior
            - recovery
      - case_id: synthetic-known-superior-2
        prompt_family: synthetic_known_superior
        prompt: Synthetic superior condition, second adaptive turn. Return a JSON object with score and evidence.
        prompt_features:
          synthetic_effect_code: 1.0
          target_length: 64.0
        validator:
          kind: json_object
          required_json_keys:
            - score
            - evidence
      - case_id: synthetic-known-superior-3
        prompt_family: synthetic_known_superior
        prompt: Synthetic superior condition, final turn. Return exactly SUPERIOR_DONE.
        prompt_features:
          synthetic_effect_code: 1.0
          target_length: 1.0
        validator:
          kind: exact_match
          expected_text: SUPERIOR_DONE

